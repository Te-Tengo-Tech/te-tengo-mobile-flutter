name: Produccion
run-name: Produccion ${{ github.sha }}

# Produccion of the mobile app (docs/RELEASES.md). Runs when a release or hotfix reaches main (the
# merged pull request release/x.y.z → main that release.yml opened) and publishes the files of the
# tested release candidate, without rebuilding. Nothing is tested here: CI tested the candidate's commit
# when release.yml built it, and release-gate.yml proved before the merge that main gets its tree.
#   1. `Find the tested candidate` (no environment): reads x.y.z from pubspec.yaml and finds, with
#      `candidata.sh buscar` (the same command as release-gate.yml), the newest pre-release
#      vx.y.z-rc.N whose recorded git tree equals the tree of this commit and whose staging passed (or
#      was switched off). None → the run fails: main differs from the tested candidate, so the change
#      must go through the release branch as a new rc. It also checks that every channel that is on was
#      on when the candidate was built, before any approval.
#   2. produccion (environment `produccion`, approval; one review approves every job). Each job first
#      checks its deploy secrets (secrets of the environment `produccion`), then the SHA-256 of the
#      candidate's asset against its SHA256SUMS:
#        - PWA → te-tengo-app production (https://app.tetengo.reqsai.tech)   ENABLE_PWA
#        - APK → R2 `te-tengo.apk` (the landing's download)                  ENABLE_APK
#        - AAB → Google Play internal track (the same AAB staging built)     ENABLE_PLAY_STORE
#        - IPA → TestFlight (the same IPA)                                   ENABLE_IOS
#      each with a smoke check.
#   3. `Tag vX.Y.Z and GitHub Release`, only when no produccion job failed or was rejected and at least
#      one was published: the GitHub Release vx.y.z on this commit with the same assets (SBOM included;
#      their attestations stay valid), notes = the CHANGELOG section + the candidate. With every channel
#      switched off nothing is deployed, so there is no tag. A failed or rejected job leaves no tag;
#      "Re-run failed jobs" publishes the same candidate again and then tags.
#   4. `Back-merge into develop`, after the tag: the pull request main → develop as te-tengo-release-bot,
#      with auto-merge (merge commit); after a hotfix also main → any newer open release/* branch.
# When vx.y.z already exists with this tree (a re-run on an already released commit) nothing runs.
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, PLAY_SERVICE_ACCOUNT_JSON, APP_STORE_CONNECT_KEY_ID,
# APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_PRIVATE_KEY of the environment `produccion`;
# RELEASE_APP_PRIVATE_KEY + variable RELEASE_APP_ID (organization) for the back-merge.
on:
  push:
    branches: [main]

permissions: {}

# One produccion at a time, shared with rollback.yml. A deploy is never cancelled.
concurrency:
  group: produccion
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  WRANGLER_VERSION: 4.149.0
  NODE_VERSION: "24"
  PAGES_PROJECT: te-tengo-app

jobs:
  localizar:
    name: Find the tested candidate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.existe.outputs.skip }}
      name: ${{ steps.version.outputs.name }}
      tag: ${{ steps.buscar.outputs.tag }}
      build: ${{ steps.buscar.outputs.build }}
      package: ${{ steps.buscar.outputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            pubspec.yaml
            .github/scripts
          sparse-checkout-cone-mode: false

      - name: Version and tree of this commit
        id: version
        run: |
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d '\r' | head -n1)
          if [[ ! "$version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\+[0-9]+$ ]]; then
            echo "::error title=Unexpected version::pubspec.yaml version '$version' is not <major>.<minor>.<patch>+<build>."
            exit 1
          fi
          {
            echo "name=${BASH_REMATCH[1]}"
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
          } >> "$GITHUB_OUTPUT"

      - name: Is this version already released?
        id: existe
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.version.outputs.name }}
          TREE: ${{ steps.version.outputs.tree }}
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$NAME" > /dev/null 2>&1; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          released=$(gh api "repos/$GITHUB_REPOSITORY/commits/v$NAME" --jq .commit.tree.sha)
          if [ "$released" = "$TREE" ]; then
            echo "::notice title=v$NAME is already released::v$NAME has this same tree; nothing to publish."
            echo "### v$NAME is already released with this tree; nothing to do" >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error title=v$NAME is already released::main says version $NAME, which was released as v$NAME with another tree. Only a release or hotfix pull request with a new version may reach main."
          exit 1

      # The same command as release-gate.yml: what passed the gate is what is deployed.
      - name: Find the candidate
        id: buscar
        if: steps.existe.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.version.outputs.name }}
          TREE: ${{ steps.version.outputs.tree }}
        run: .github/scripts/candidata.sh buscar "$NAME" "$TREE"

      # The deploy secrets belong to the environment `produccion`; each produccion job checks its own.
      - name: Check the channels that are on
        if: steps.existe.outputs.skip != 'true'
        env:
          TAG: ${{ steps.buscar.outputs.tag }}
          CANALES: ${{ steps.buscar.outputs.canales }}
          ENABLE_PWA: ${{ vars.ENABLE_PWA }}
          ENABLE_APK: ${{ vars.ENABLE_APK }}
          ENABLE_PLAY_STORE: ${{ vars.ENABLE_PLAY_STORE }}
          ENABLE_IOS: ${{ vars.ENABLE_IOS }}
          DESCARGAS_BASE_URL: ${{ vars.DESCARGAS_BASE_URL }}
        run: |
          errors=()
          # canal <switch> <channel>: a channel that is on must have been on when the candidate was built,
          # so that its configuration was checked and it went through staging.
          canal() {
            [ "${!1}" = true ] || return 1
            if [[ ",$CANALES," != *",$2,"* ]]; then
              errors+=("$1 is 'true', but it was off when $TAG was built, so $TAG has no checked $2 build. Build a new candidate on the release branch with $1 on, or set $1 to false")
            fi
            return 0
          }
          canal ENABLE_PWA pwa || true
          if canal ENABLE_APK apk; then
            [ -n "$DESCARGAS_BASE_URL" ] || errors+=("ENABLE_APK needs the DESCARGAS_BASE_URL variable")
          fi
          canal ENABLE_PLAY_STORE play || true
          canal ENABLE_IOS ios || true
          if [ ${#errors[@]} -gt 0 ]; then
            echo "### Produccion cannot publish $TAG" >> "$GITHUB_STEP_SUMMARY"
            for e in "${errors[@]}"; do
              echo "::error title=Channel not ready::$e (docs/RELEASES.md)."
              echo "- $e" >> "$GITHUB_STEP_SUMMARY"
            done
            exit 1
          fi

      - name: Plan
        if: steps.existe.outputs.skip != 'true'
        env:
          NAME: ${{ steps.version.outputs.name }}
          TAG: ${{ steps.buscar.outputs.tag }}
          BUILD: ${{ steps.buscar.outputs.build }}
          COMMIT: ${{ steps.buscar.outputs.commit }}
          STAGING: ${{ steps.buscar.outputs.staging }}
          ENABLE_PWA: ${{ vars.ENABLE_PWA }}
          ENABLE_APK: ${{ vars.ENABLE_APK }}
          ENABLE_PLAY_STORE: ${{ vars.ENABLE_PLAY_STORE }}
          ENABLE_IOS: ${{ vars.ENABLE_IOS }}
          DESCARGAS_BASE_URL: ${{ vars.DESCARGAS_BASE_URL }}
        run: |
          estado() { if [ "${!1}" = true ]; then echo "after approval on \`produccion\`"; else echo "skipped (\`$1\` is not \`true\`)"; fi; }
          on=0
          for switch in ENABLE_PWA ENABLE_APK ENABLE_PLAY_STORE ENABLE_IOS; do
            [ "${!switch}" != true ] || on=$((on + 1))
          done
          base=${DESCARGAS_BASE_URL:-<DESCARGAS_BASE_URL>}
          {
            echo "## Produccion $NAME: candidate \`$TAG\` (build $BUILD, staging $STAGING)"
            echo "Built from \`${COMMIT:0:12}\`; this commit \`${GITHUB_SHA:0:12}\` has the same tree. Nothing is rebuilt."
            echo
            echo "| Channel | Target | Asset | This run |"
            echo "|---|---|---|---|"
            echo "| PWA | https://app.tetengo.reqsai.tech | \`te-tengo-pwa.tar.gz\` | $(estado ENABLE_PWA) |"
            echo "| APK | $base/te-tengo.apk | \`te-tengo.apk\` | $(estado ENABLE_APK) |"
            echo "| Google Play | internal testing track | \`te-tengo.aab\` | $(estado ENABLE_PLAY_STORE) |"
            echo "| TestFlight | App Store Connect | \`te-tengo.ipa\` | $(estado ENABLE_IOS) |"
            echo
            if [ "$on" -gt 0 ]; then
              echo "Then, only if at least one channel is published and none fails: GitHub Release \`v$NAME\` and the back-merge pull request into \`develop\`."
            else
              echo "**Every channel is switched off: nothing is deployed, so \`v$NAME\` is not tagged and no back-merge pull request is opened.** Turn a channel on and re-run all jobs of this run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$on" -eq 0 ]; then
            echo "::notice title=Every channel is switched off::ENABLE_PWA, ENABLE_APK, ENABLE_PLAY_STORE and ENABLE_IOS are not 'true': nothing is deployed, v$NAME is not tagged and develop gets no back-merge."
          fi

  # ── Produccion: every job waits for the same approval ───────────────────────────────────────────
  produccion-pwa:
    name: Produccion · PWA
    needs: localizar
    if: needs.localizar.outputs.skip != 'true' && vars.ENABLE_PWA == 'true'
    environment:
      name: produccion
      url: https://app.tetengo.reqsai.tech
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TAG: ${{ needs.localizar.outputs.tag }}
    steps:
      - name: Check the Cloudflare secrets
        env:
          HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          NAME: ${{ needs.localizar.outputs.name }}
        run: |
          if [ "$HAS_CLOUDFLARE" != true ]; then
            echo "::error title=Cloudflare secrets missing::ENABLE_PWA is 'true', but the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID of the environment produccion are not set (docs/RELEASES.md). Nothing was deployed and v$NAME is not tagged; add them and re-run the failed jobs."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Download the candidate's PWA and check its SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/candidata.sh descargar "$TAG" "$RUNNER_TEMP/candidata" te-tengo-pwa.tar.gz
          mkdir -p "$RUNNER_TEMP/pwa"
          tar -xzf "$RUNNER_TEMP/candidata/te-tengo-pwa.tar.gz" -C "$RUNNER_TEMP/pwa"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Deploy to production and smoke check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: .github/scripts/deploy_pwa.sh "$RUNNER_TEMP/pwa" main https://app.tetengo.reqsai.tech

  produccion-apk:
    name: Produccion · APK
    needs: localizar
    if: needs.localizar.outputs.skip != 'true' && vars.ENABLE_APK == 'true'
    environment:
      name: produccion
      url: ${{ vars.DESCARGAS_BASE_URL }}/te-tengo.apk
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      R2_BUCKET: ${{ vars.DESCARGAS_R2_BUCKET || 'te-tengo-descargas' }}
      DESCARGAS_BASE_URL: ${{ vars.DESCARGAS_BASE_URL }}
      TAG: ${{ needs.localizar.outputs.tag }}
    steps:
      - name: Check the Cloudflare secrets
        env:
          HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          NAME: ${{ needs.localizar.outputs.name }}
        run: |
          if [ "$HAS_CLOUDFLARE" != true ]; then
            echo "::error title=Cloudflare secrets missing::ENABLE_APK is 'true', but the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID of the environment produccion are not set (docs/RELEASES.md). Nothing was uploaded and v$NAME is not tagged; add them and re-run the failed jobs."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Download the candidate's APK and check its SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/candidata.sh descargar "$TAG" "$RUNNER_TEMP/apk" te-tengo.apk te-tengo.apk.sha256
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Upload to R2 and smoke check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: .github/scripts/upload_apk.sh "$RUNNER_TEMP/apk" ""

  produccion-play:
    name: Produccion · Google Play (internal)
    needs: localizar
    if: needs.localizar.outputs.skip != 'true' && vars.ENABLE_PLAY_STORE == 'true'
    environment: produccion
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TAG: ${{ needs.localizar.outputs.tag }}
    steps:
      - name: Check the Google Play secret
        env:
          HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
          NAME: ${{ needs.localizar.outputs.name }}
        run: |
          if [ "$HAS_PLAY" != true ]; then
            echo "::error title=Google Play secret missing::ENABLE_PLAY_STORE is 'true', but the secret PLAY_SERVICE_ACCOUNT_JSON of the environment produccion is not set (Play Console service account; docs/RELEASE_ANDROID.md). Nothing was uploaded and v$NAME is not tagged; add it and re-run the failed jobs."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Download the candidate's AAB and check its SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/candidata.sh descargar "$TAG" "$RUNNER_TEMP/aab" te-tengo.aab
      # The upload fails unless Google Play accepts the bundle (signature, package, versionCode), so a
      # successful step is the smoke check.
      - name: Upload to Google Play (internal testing)
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ needs.localizar.outputs.package }}
          releaseFiles: ${{ runner.temp }}/aab/te-tengo.aab
          releaseName: ${{ needs.localizar.outputs.name }} (${{ needs.localizar.outputs.build }})
          track: internal
          # draft while the app itself is still a draft in Play Console (docs/RELEASE_ANDROID.md).
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
      - name: Summary
        env:
          NAME: ${{ needs.localizar.outputs.name }}
          BUILD: ${{ needs.localizar.outputs.build }}
        run: echo "### Android $NAME ($BUILD) from $TAG uploaded to the Google Play internal track" >> "$GITHUB_STEP_SUMMARY"

  produccion-testflight:
    # The App Store Connect API upload runs on Linux (https://github.com/Apple-Actions/upload-testflight-build).
    name: Produccion · TestFlight
    needs: localizar
    if: needs.localizar.outputs.skip != 'true' && vars.ENABLE_IOS == 'true'
    environment: produccion
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      TAG: ${{ needs.localizar.outputs.tag }}
    steps:
      - name: Check the App Store Connect secrets
        env:
          HAS_ASC: ${{ secrets.APP_STORE_CONNECT_KEY_ID != '' && secrets.APP_STORE_CONNECT_ISSUER_ID != '' && secrets.APP_STORE_CONNECT_PRIVATE_KEY != '' }}
          NAME: ${{ needs.localizar.outputs.name }}
        run: |
          if [ "$HAS_ASC" != true ]; then
            echo "::error title=App Store Connect secrets missing::ENABLE_IOS is 'true', but the secrets APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID and APP_STORE_CONNECT_PRIVATE_KEY of the environment produccion are not all set (docs/RELEASES.md). Nothing was uploaded and v$NAME is not tagged; add them and re-run the failed jobs."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Download the candidate's IPA and check its SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/candidata.sh descargar "$TAG" "$RUNNER_TEMP/ipa" te-tengo.ipa
      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@65a84cdb671ee2ccfa93710cd58e8f7b5d251967 # v5.5.1
        with:
          app-path: ${{ runner.temp }}/ipa/te-tengo.ipa
          app-type: ios
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          # Smoke check: wait for App Store Connect to process the build, so an invalid binary fails.
          wait-for-processing: "true"
      - name: Summary
        env:
          NAME: ${{ needs.localizar.outputs.name }}
          BUILD: ${{ needs.localizar.outputs.build }}
        run: |
          {
            echo "### iOS $NAME ($BUILD) from $TAG uploaded to TestFlight"
            echo "Internal testers get it once App Store Connect shows it as ready (export compliance answered; docs/RELEASES.md)."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Tag at the end ──────────────────────────────────────────────────────────────────────────────
  # Only a version that is live gets vX.Y.Z: no produccion job failed or was rejected, and at least one
  # was published (a job skipped by its switch does not block, but it does not count either).
  publicar:
    name: Tag vX.Y.Z and GitHub Release
    needs: [localizar, produccion-pwa, produccion-apk, produccion-play, produccion-testflight]
    if: >-
      !cancelled() && !failure() && needs.localizar.outputs.skip != 'true'
      && (needs.produccion-pwa.result == 'success' || needs.produccion-apk.result == 'success'
      || needs.produccion-play.result == 'success' || needs.produccion-testflight.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # creates the tag vX.Y.Z and its GitHub Release
    env:
      NAME: ${{ needs.localizar.outputs.name }}
      TAG: ${{ needs.localizar.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            CHANGELOG.md
            .github/scripts
          sparse-checkout-cone-mode: false

      - name: GitHub Release with the candidate's files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/final"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir "$RUNNER_TEMP/sumas"
          mapfile -t assets < <(awk '{ print $2 }' "$RUNNER_TEMP/sumas/SHA256SUMS")
          .github/scripts/candidata.sh descargar "$TAG" "$dir" "${assets[@]}"
          .github/scripts/candidata.sh final "$TAG" "$dir" CHANGELOG.md

  # The pull request main → develop (and main → newer open release/* after a hotfix), opened by the
  # GitHub App te-tengo-release-bot so that its checks run, with auto-merge when the repository allows it.
  back-merge:
    name: Back-merge into develop
    needs: [localizar, publicar]
    if: ${{ !cancelled() && needs.publicar.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Check the release bot configuration
        env:
          APP_ID: ${{ vars.RELEASE_APP_ID }}
          HAS_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        run: |
          if [ -z "$APP_ID" ] || [ "$HAS_KEY" != true ]; then
            echo "::error title=Release bot not configured::The organization variable RELEASE_APP_ID and the organization secret RELEASE_APP_PRIVATE_KEY (GitHub App te-tengo-release-bot) are required to open the back-merge pull request. Nothing falls back to GITHUB_TOKEN: its pull requests start no workflows."
            exit 1
          fi
      - name: Mint the release bot token
        id: bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # The App ID; GitHub accepts it as the JWT issuer like the client ID.
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write # auto-merge
          permission-pull-requests: write
      - name: Open the back-merge pull requests
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          NAME: ${{ needs.localizar.outputs.name }}
        run: .github/scripts/back-merge.sh "$NAME"
