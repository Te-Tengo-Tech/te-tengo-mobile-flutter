name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

# A new push to the same branch or pull request cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Format and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get --enforce-lockfile
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze

  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get --enforce-lockfile
      - name: Unit, widget and golden tests with coverage
        run: flutter test --coverage
      - name: Coverage summary
        if: always()
        run: python3 .github/scripts/lcov_summary.py coverage/lcov.info >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14
      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures
          path: test/**/failures/
          if-no-files-found: ignore
          retention-days: 7

  web:
    name: Web (PWA)
    runs-on: ubuntu-latest
    env:
      # Served from the landing site (te-tengo-landing-astro on Cloudflare Pages) under /app/.
      # Override with the repository variable TT_WEB_BASE_HREF (docs/WEB_PWA.md).
      BASE_HREF: ${{ vars.TT_WEB_BASE_HREF || '/app/' }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build config from repository variables
        # Public values (they ship in the page) kept as repository variables, not in git. Missing
        # ones are left out: the build still works, with push unavailable (docs/WEB_PWA.md).
        env:
          TT_API_URL: ${{ vars.TT_API_URL }}
          TT_FIREBASE_WEB_API_KEY: ${{ vars.TT_FIREBASE_WEB_API_KEY }}
          TT_FIREBASE_WEB_AUTH_DOMAIN: ${{ vars.TT_FIREBASE_WEB_AUTH_DOMAIN }}
          TT_FIREBASE_WEB_PROJECT_ID: ${{ vars.TT_FIREBASE_WEB_PROJECT_ID }}
          TT_FIREBASE_WEB_STORAGE_BUCKET: ${{ vars.TT_FIREBASE_WEB_STORAGE_BUCKET }}
          TT_FIREBASE_WEB_MESSAGING_SENDER_ID: ${{ vars.TT_FIREBASE_WEB_MESSAGING_SENDER_ID }}
          TT_FIREBASE_WEB_APP_ID: ${{ vars.TT_FIREBASE_WEB_APP_ID }}
          TT_FIREBASE_WEB_MEASUREMENT_ID: ${{ vars.TT_FIREBASE_WEB_MEASUREMENT_ID }}
          TT_FCM_VAPID_KEY: ${{ vars.TT_FCM_VAPID_KEY }}
        run: |
          echo '{}' > web-defines.json
          for name in TT_API_URL TT_FIREBASE_WEB_API_KEY TT_FIREBASE_WEB_AUTH_DOMAIN \
            TT_FIREBASE_WEB_PROJECT_ID TT_FIREBASE_WEB_STORAGE_BUCKET \
            TT_FIREBASE_WEB_MESSAGING_SENDER_ID TT_FIREBASE_WEB_APP_ID \
            TT_FIREBASE_WEB_MEASUREMENT_ID TT_FCM_VAPID_KEY; do
            if [ -n "${!name}" ]; then
              jq --arg k "$name" --arg v "${!name}" '.[$k] = $v' web-defines.json > tmp.json
              mv tmp.json web-defines.json
            fi
          done
          echo "Defines set: $(jq -r 'keys | join(", ")' web-defines.json)" >> "$GITHUB_STEP_SUMMARY"
      - name: Build
        run: >-
          flutter build web --release
          --base-href "$BASE_HREF"
          --no-web-resources-cdn
          --dart-define-from-file=web-defines.json
      - name: Check the PWA files
        run: |
          for f in index.html manifest.json flutter_bootstrap.js firebase-messaging-sw.js \
            icons/Icon-192.png icons/Icon-512.png icons/Icon-maskable-512.png icons/apple-touch-icon.png; do
            test -s "build/web/$f" || { echo "::error::missing build/web/$f"; exit 1; }
          done
          grep -q "<base href=\"$BASE_HREF\">" build/web/index.html
          # Flutter's deprecated service worker must not be registered by the bootstrap.
          ! grep -q serviceWorkerSettings build/web/flutter_bootstrap.js
      - name: Upload the web build
        uses: actions/upload-artifact@v7
        with:
          name: te-tengo-web
          path: build/web
          if-no-files-found: error
          retention-days: 14
