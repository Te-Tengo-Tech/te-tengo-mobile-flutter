name: Release Android

# Builds the release Android App Bundle (AAB) and uploads it to Google Play's **internal** testing
# track, and, through the reusable build-apk.yml, builds the **universal release APK** (`te-tengo.apk`)
# as a run artifact (docs/RELEASE_ANDROID.md). Both are signed with the same release key. The APK
# that testers download is published by the landing's publicar.yml, started by notificar-landing.yml;
# this workflow only keeps its own copy as a build check.
#
# The Google Play channel is switched by the ORGANIZATION variable ENABLE_PLAY_STORE (Te-Tengo-Tech →
# Settings → Secrets and variables → Actions → Variables; docs/RELEASES.md):
#   - not 'true' (false or unset): on a push to main the AAB is not built and the Play job is skipped
#     without asking for an approval. Pull requests and manual runs still build the AAB.
#   - 'true': on a push to main (a merged release/* or hotfix/*), or a manual run from main, the AAB is
#     built once and the `Upload to Google Play (internal)` job waits for an approval on the
#     `produccion` environment (main only) before uploading it. A missing Play secret, release key or
#     TT_API_URL then fails the run with an error that names it, before the build.
#
# Secrets (repository: Settings → Secrets and variables → Actions):
#   GOOGLE_SERVICES_JSON         base64 of android/app/google-services.json (Firebase, push)
#   ANDROID_KEYSTORE_BASE64      base64 of the release keystore (.jks): the Play upload key and the
#                                APK signing key (sideloaded updates must always use this same key)
#   ANDROID_KEYSTORE_PASSWORD    keystore password
#   ANDROID_KEY_ALIAS            key alias (e.g. upload)
#   ANDROID_KEY_PASSWORD         key password
#   PLAY_SERVICE_ACCOUNT_JSON    JSON key of the Google Cloud service account invited to Play Console
# Variables:
#   ENABLE_PLAY_STORE            organization variable, 'true' turns the Play channel on
#   TT_API_URL                   HTTPS URL of the production API, compiled into the app (a secret of
#                                the same name also works)

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: versionCode override (blank = the +N of pubspec.yaml). Each Play upload needs a higher one.
        default: ""
      release_status:
        description: Play release status. Use draft while the app itself is still a draft in Play Console.
        type: choice
        options: [completed, draft]
        default: completed
  # A release merged into main. (Version tags are not used: the produccion environment only accepts
  # the main branch.) Builds the AAB only when ENABLE_PLAY_STORE is 'true'.
  push:
    branches: [main]
  # Pull requests that touch the Android build only build the AAB and the APK, to keep the release
  # path green.
  pull_request:
    paths:
      - android/**
      - pubspec.yaml
      - pubspec.lock
      - .github/workflows/release-android.yml

permissions:
  contents: read

concurrency:
  group: release-android-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build AAB
    # On a push to main the AAB exists only to be uploaded, so it is built only with the Play channel
    # switched on. Pull requests and manual runs always build it.
    if: github.event_name != 'push' || vars.ENABLE_PLAY_STORE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      name: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
      package: ${{ steps.version.outputs.package }}
      aab_artifact: ${{ steps.artifact.outputs.name }}
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      TT_API_URL: ${{ vars.TT_API_URL || secrets.TT_API_URL }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the release configuration
        id: config
        env:
          # The Play upload follows: a push or manual run on main with the channel switched on.
          PLAY_WANTED: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ENABLE_PLAY_STORE == 'true' }}
        run: |
          faltan=()
          [ -n "$GOOGLE_SERVICES_JSON" ] && echo "firebase=true" >> "$GITHUB_OUTPUT" || faltan+=("GOOGLE_SERVICES_JSON secret (push notifications)")
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "upload_key=true" >> "$GITHUB_OUTPUT"
          else
            faltan+=("ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets (release key; Google Play rejects the debug-signed AAB built without them)")
            if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
              echo "::notice title=AAB debug-signed::The release keystore secrets are missing, so the AAB is signed with this runner's throwaway debug key, which Google Play rejects. Setup: docs/RELEASE_ANDROID.md"
            fi
          fi
          [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ] || faltan+=("PLAY_SERVICE_ACCOUNT_JSON secret (Play Console service account)")
          [ -n "$TT_API_URL" ] || faltan+=("TT_API_URL repository variable or secret (the app would point to http://10.0.2.2:8080)")
          if [ "$PLAY_WANTED" != true ]; then
            exit 0
          fi
          # ENABLE_PLAY_STORE is 'true': every missing piece is an error, before the 10-minute build.
          if [ ${#faltan[@]} -gt 0 ]; then
            for falta in "${faltan[@]}"; do
              echo "::error title=Google Play is enabled but not configured::ENABLE_PLAY_STORE is 'true' and this is missing: $falta. Add it (docs/RELEASES.md) or set the organization variable ENABLE_PLAY_STORE to false."
            done
            {
              echo "### Google Play enabled but not configured"
              echo "The organization variable \`ENABLE_PLAY_STORE\` is \`true\`, but this is missing (docs/RELEASES.md):"
              printf -- '- %s\n' "${faltan[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Read the version from pubspec.yaml
        id: version
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d '\r')
          name=${version%%+*}
          code=${version#*+}
          [ -n "$BUILD_NUMBER" ] && code=$BUILD_NUMBER
          # The Play package name is the applicationId of the Android build.
          package=$(sed -n 's/^[[:space:]]*applicationId[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' android/app/build.gradle.kts)
          if [ "$(printf '%s\n' "$package" | grep -c .)" != 1 ]; then
            echo "::error::Expected one applicationId in android/app/build.gradle.kts, found '$package'"
            exit 1
          fi
          {
            echo "name=$name"
            echo "code=$code"
            echo "package=$package"
          } >> "$GITHUB_OUTPUT"
          echo "Version $name ($code), package $package"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Firebase config (google-services.json)
        if: steps.config.outputs.firebase == 'true'
        run: echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
      - name: Release key (key.properties)
        if: steps.config.outputs.upload_key == 'true'
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build the release AAB
        env:
          API_URL: ${{ vars.TT_API_URL || secrets.TT_API_URL || 'http://10.0.2.2:8080' }}
        run: |
          timeout 40m flutter build appbundle --release \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${{ steps.version.outputs.code }}" \
            --dart-define=TT_API_URL="$API_URL"
      - name: Remove the signing material
        if: always()
        run: rm -f android/key.properties android/app/upload-keystore.jks android/app/google-services.json

      - name: Artifact name
        id: artifact
        env:
          NAME: te-tengo-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}${{ steps.config.outputs.upload_key != 'true' && '-debug-signed' || '' }}-aab
        run: echo "name=$NAME" >> "$GITHUB_OUTPUT"
      - name: Upload the AAB as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 30 }}

      - name: Summary
        if: always()
        run: |
          {
            echo "## Android ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})"
            echo "- Signing: ${{ steps.config.outputs.upload_key == 'true' && 'release key' || 'debug key (not accepted by Google Play; a sideloaded APK cannot be updated by a later build)' }}"
            echo "- Push (google-services.json): ${{ steps.config.outputs.firebase == 'true' && 'included' || 'not included' }}"
            echo "- Google Play internal track: ${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ENABLE_PLAY_STORE == 'true') && 'uploaded by the «Upload to Google Play (internal)» job after approval on the produccion environment' || 'not uploaded (only from main with the organization variable ENABLE_PLAY_STORE set to true)' }}"
          } >> "$GITHUB_STEP_SUMMARY"

  play:
    # Waits for a required reviewer of the produccion environment (main only). Skipped, without asking
    # for approval, on pull requests, on other branches and while ENABLE_PLAY_STORE is not 'true'.
    # The build job has already failed if the Play secrets are missing.
    name: Upload to Google Play (internal)
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ENABLE_PLAY_STORE == 'true'
    environment: produccion
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.aab_artifact }}
          path: aab
      - name: Upload to Google Play (internal testing)
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ needs.build.outputs.package }}
          releaseFiles: aab/app-release.aab
          releaseName: ${{ needs.build.outputs.name }} (${{ needs.build.outputs.code }})
          track: internal
          status: ${{ inputs.release_status || 'completed' }}
      - name: Summary
        env:
          NAME: ${{ needs.build.outputs.name }}
          CODE: ${{ needs.build.outputs.code }}
        run: echo "Android $NAME ($CODE) uploaded to the Google Play internal track." >> "$GITHUB_STEP_SUMMARY"

  apk:
    # The universal release APK for sideloading, built by the same reusable workflow that the
    # landing's publish workflow calls. The artifact holds te-tengo.apk and te-tengo.apk.sha256.
    name: APK
    uses: ./.github/workflows/build-apk.yml
    permissions:
      contents: read
    with:
      build_number: ${{ inputs.build_number || '' }}
      artifact_name: te-tengo-apk
      retention_days: ${{ github.event_name == 'pull_request' && 3 || 30 }}
    secrets: inherit
