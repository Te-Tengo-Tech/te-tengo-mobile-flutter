# Weekly dependency updates, opened against `develop`.
# Minor and patch updates arrive grouped in one pull request; major updates arrive one by one.
# Branch names: dependabot/<ecosystem>/develop/<group-or-dependency>.
version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # The Android Gradle build (Android Gradle Plugin, Kotlin, Gradle wrapper).
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    commit-message:
      prefix: "ci(deps)"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
