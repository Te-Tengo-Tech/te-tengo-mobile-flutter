# Native launch screen: cream with the symbol, like the splash screen (DESIGN.md, screen 00), so the
# app does not flash before Flutter draws the animated splash. Light in dark mode too: the splash
# of the brand kit is always on cream.
# Regenerate with: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFF7F1"
  image: assets/icono/simbolo.png
  android_12:
    color: "#FFF7F1"
    image: assets/icono/splash-android12.png
    icon_background_color: "#FFF7F1"
  web: false
